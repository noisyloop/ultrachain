<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trading Report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --border: rgba(11,11,11,0.10);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --up: #2a78d6; --down: #e34948; --line: #2a78d6;
  --good-text: #006300; --bad-text: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --up: #3987e5; --down: #e66767; --line: #3987e5;
    --good-text: #0ca30c; --bad-text: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --up: #3987e5; --down: #e66767; --line: #3987e5;
  --good-text: #0ca30c; --bad-text: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { font-size: 20px; font-weight: 600; margin: 0; }
header p { margin: 2px 0 0; color: var(--ink-2); }
.badge {
  display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--border); font-size: 12px; color: var(--ink-2); vertical-align: 2px;
}
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile.hero .value { font-size: 30px; }
.pos { color: var(--good-text); } .neg { color: var(--bad-text); }
.grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 2;
}
.tip b { font-variant-numeric: tabular-nums; }
.section { margin-top: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--axis); }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; }
.verdict { margin-top: 12px; border-left: 3px solid var(--muted); }
.verdict b { display: block; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Paper trading report <span class="badge">paper · no real trades</span></h1>
    <p id="period"></p>
  </header>
  <section class="tiles" id="tiles"></section>
  <div class="grid2">
    <div class="card"><h2>Equity</h2><div class="chart" id="equity"></div></div>
    <div class="card"><h2>Exits by reason</h2><div class="scroll" id="reasons"></div></div>
  </div>
  <div class="card section"><h2>Daily realized PnL</h2><div class="chart" id="daily"></div></div>
  <div class="grid2 section">
    <div class="card"><h2>Recent closed trades</h2><div class="scroll" id="recent"></div></div>
    <div class="card"><h2>Rejected signals</h2><div class="scroll" id="rejects"></div></div>
  </div>
  <div class="card verdict"><b>Verdict</b><span id="verdict"></span></div>
</main>
<script>
const D = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const fmt = (v, d = 2) => v == null ? "—" : v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (v, d = 2) => (v > 0 ? "+" : "") + fmt(v, d);
const cls = (v) => v > 0 ? "pos" : v < 0 ? "neg" : "";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const dateFmt = (ms) => new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const dtFmt = (ms) => new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

// "Nice" tick values covering [lo, hi].
function ticks(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10));
  if (out[0] > lo) out.unshift(out[0] - step);
  if (out[out.length - 1] < hi) out.push(out[out.length - 1] + step);
  return out;
}

function frame(host, W, H, m, yTicks, yScale, yLabel) {
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" }, host);
  for (const t of yTicks) {
    const y = yScale(t);
    el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: m.l - 8, y: y + 4, "text-anchor": "end", class: "tick" }, svg).textContent = yLabel(t);
  }
  return svg;
}

function tooltip(host) {
  const tip = document.createElement("div");
  tip.className = "tip";
  host.appendChild(tip);
  return {
    show(html, x, y) {
      tip.innerHTML = html; tip.style.display = "block";
      const w = tip.offsetWidth, hw = host.clientWidth;
      tip.style.left = Math.min(Math.max(0, x - w / 2), hw - w) + "px";
      tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + "px";
    },
    hide() { tip.style.display = "none"; },
  };
}

function equityChart(host, pts) {
  if (pts.length < 2) { host.innerHTML = '<div class="empty">Not enough equity snapshots yet.</div>'; return; }
  const W = 720, H = 260, m = { l: 56, r: 12, t: 10, b: 26 };
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const yt = ticks(Math.min(...ys), Math.max(...ys));
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const X = (v) => m.l + (v - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
  const Y = (v) => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const svg = frame(host, W, H, m, yt, Y, (t) => fmt(t, 0));
  el("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: "var(--axis)" }, svg);
  const days = Math.max(1, Math.round((x1 - x0) / 864e5));
  const every = Math.ceil(days / 6) * 864e5;
  for (let t = x0; t <= x1; t += every) {
    el("text", { x: X(t), y: H - 8, "text-anchor": "middle", class: "tick" }, svg).textContent = dateFmt(t);
  }
  // Starting balance reference.
  el("line", { x1: m.l, x2: W - m.r, y1: Y(ys[0]), y2: Y(ys[0]), stroke: "var(--muted)", "stroke-dasharray": "3 4" }, svg);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  el("path", { d, fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);

  const tip = tooltip(host);
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", visibility: "hidden" }, svg);
  const dot = el("circle", { r: 4.5, fill: "var(--line)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", (e) => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W;
    let i = 0, best = Infinity;
    pts.forEach((p, j) => { const dd = Math.abs(X(p[0]) - sx); if (dd < best) { best = dd; i = j; } });
    const [t, v] = pts[i], px = X(t), py = Y(v);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    const k = r.width / W;
    tip.show(`${dtFmt(t)}<br>Equity <b>${fmt(v)}</b> <span class="${cls(v - ys[0])}">${signed(v - ys[0])}</span>`, px * k, py * k);
  });
  hit.addEventListener("pointerleave", () => { tip.hide(); cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
}

function dailyChart(host, days) {
  if (!days.length) { host.innerHTML = '<div class="empty">No closed trades yet.</div>'; return; }
  const W = 1080, H = 200, m = { l: 56, r: 12, t: 10, b: 26 };
  const vals = days.map((d) => d[1]);
  const yt = ticks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const Y = (v) => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const svg = frame(host, W, H, m, yt, Y, (t) => fmt(t, 0));
  const band = (W - m.l - m.r) / days.length, bw = Math.min(28, band - 2);
  const tip = tooltip(host);
  days.forEach(([day, v], i) => {
    const cx = m.l + band * (i + 0.5), top = Y(Math.max(v, 0)), bot = Y(Math.min(v, 0));
    const h = Math.max(1, bot - top), r = Math.min(4, h / 2, bw / 2);
    // Rounded at the data end, square at the zero baseline.
    const x = cx - bw / 2;
    const d = v >= 0
      ? `M${x} ${bot}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + bw - r}Q${x + bw} ${top} ${x + bw} ${top + r}V${bot}Z`
      : `M${x} ${top}V${bot - r}Q${x} ${bot} ${x + r} ${bot}H${x + bw - r}Q${x + bw} ${bot} ${x + bw} ${bot - r}V${top}Z`;
    el("path", { d, fill: v >= 0 ? "var(--up)" : "var(--down)" }, svg);
    if (days.length <= 31 && (i % Math.ceil(days.length / 10) === 0)) {
      el("text", { x: cx, y: H - 8, "text-anchor": "middle", class: "tick" }, svg).textContent = dateFmt(Date.parse(day));
    }
    const hit = el("rect", { x: m.l + band * i, y: m.t, width: band, height: H - m.t - m.b, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", () => {
      const k = svg.getBoundingClientRect().width / W;
      tip.show(`${esc(day)}<br>PnL <b class="${cls(v)}">${signed(v)}</b>`, cx * k, top * k);
    });
    hit.addEventListener("pointerleave", () => tip.hide());
  });
  el("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: "var(--axis)" }, svg);
}

function table(host, cols, rows, empty) {
  if (!rows.length) { host.innerHTML = `<div class="empty">${empty}</div>`; return; }
  host.innerHTML = `<table><thead><tr>${cols.map((c) => `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody>${
    rows.map((r) => `<tr>${cols.map((c) => `<td class="${c.num ? "num " : ""}${c.cls ? c.cls(r) : ""}">${c.v(r)}</td>`).join("")}</tr>`).join("")
  }</tbody></table>`;
}

function held(s) {
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}

(function render() {
  if (!D) return;
  const ms = (s) => s ? Date.parse(s) : null;
  const a = ms(D.first_ts), b = ms(D.last_ts);
  $("period").textContent = a ? `${dtFmt(a)} → ${dtFmt(b)} · ${((b - a) / 864e5).toFixed(1)} days` : "No data yet";

  const ret = D.start_equity ? (D.end_equity - D.start_equity) / D.start_equity * 100 : null;
  const tiles = [
    { label: "Equity", value: fmt(D.end_equity), sub: ret == null ? "" : `<span class="${cls(ret)}">${signed(ret)}%</span> since start`, hero: true },
    { label: "Realized PnL", value: `<span class="${cls(D.net)}">${signed(D.net)}</span>`, sub: `fees ${fmt(D.fees)}` },
    { label: "Win rate", value: D.trades ? fmt(D.wins / D.trades * 100, 1) + "%" : "—", sub: `${D.wins} of ${D.trades} closed` },
    { label: "Profit factor", value: D.profit_factor == null ? "—" : fmt(D.profit_factor), sub: "gross win ÷ gross loss" },
    { label: "Max drawdown", value: fmt(D.max_drawdown), sub: `${fmt(D.max_drawdown_pct)}% from peak` },
    { label: "Daily-cap halts", value: String(D.halts), sub: `${D.opened} positions opened` },
  ];
  $("tiles").innerHTML = tiles.map((t) =>
    `<div class="card tile${t.hero ? " hero" : ""}"><div class="label">${t.label}</div><div class="value">${t.value}</div><div class="sub">${t.sub}</div></div>`).join("");

  equityChart($("equity"), D.equity);
  dailyChart($("daily"), D.by_day);
  table($("reasons"), [
    { h: "Reason", v: (r) => esc(r.reason.replace("_", " ")) },
    { h: "Trades", num: true, v: (r) => r.n },
    { h: "PnL", num: true, v: (r) => signed(r.pnl), cls: (r) => cls(r.pnl) },
  ], D.by_reason, "No exits yet.");
  table($("recent"), [
    { h: "Closed", v: (r) => dtFmt(Date.parse(r.ts)) },
    { h: "Token", v: (r) => esc(r.symbol) },
    { h: "Exit", v: (r) => esc(r.reason.replace("_", " ")) },
    { h: "Held", num: true, v: (r) => held(r.held_secs) },
    { h: "PnL", num: true, v: (r) => signed(r.pnl), cls: (r) => cls(r.pnl) },
    { h: "%", num: true, v: (r) => signed(r.pnl_pct, 1), cls: (r) => cls(r.pnl_pct) },
  ], D.recent, "No closed trades yet.");
  table($("rejects"), [
    { h: "Reason", v: (r) => esc(r.reason) },
    { h: "Count", num: true, v: (r) => r.n },
  ], D.rejects, "No rejected signals.");
  $("verdict").textContent = D.verdict;
})();
</script>
</body>
</html>
